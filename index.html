<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100f">
  <title>أثر | حساباتنا الرسمية</title>
  <style>
    :root{--gold:#c9a96e;--gold2:#ead6aa;--gold3:#8f754c;--ink:#11100f;--gap:13px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;color:#f7f1e7;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,#46391f 0%,#1a1712 40%,#0b0b0a 100%)}
    .page{width:min(100%,430px);text-align:center}
    .mark{width:100px;height:100px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;color:var(--gold2);font:700 50px/1 Tahoma,serif;background:radial-gradient(circle at 50% 35%,#2a2316,#14120f 70%);box-shadow:0 0 0 1px var(--gold),0 0 0 6px #14120f,0 0 0 7px #8f754c88,0 0 44px #c9a96e2b}
    h1{margin:0;font:700 46px/1.25 Tahoma,serif;color:var(--gold2)}
    .sub{margin:8px 0 22px;color:#c9c0b2;font-size:14px;line-height:1.9}
    .rule{display:flex;align-items:center;gap:12px;margin:0 0 var(--gap);color:#b9ad98;font-size:13px}
    .rule:before,.rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}
    .rule.gem{margin-bottom:24px;color:var(--gold);font-size:9px}
    .links{display:grid;gap:var(--gap)}
    a{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:12px 52px;border:1px solid #7d6743;border-radius:14px;color:#f7f1e7;text-decoration:none;font-weight:700;font-size:15px;background:linear-gradient(145deg,#2c261c,#16140f);box-shadow:inset 0 1px 0 #ffffff12,0 10px 22px #0000005c;transition:transform .18s ease,border-color .18s ease}
    a:hover{transform:translateY(-2px);border-color:var(--gold2)}
    a:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
    .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:block}
    .pay-wrap{margin-top:30px}
    .pay{display:grid;grid-template-columns:repeat(2,minmax(0,130px));justify-content:center;gap:var(--gap)}
    .tile{min-height:142px;padding:12px 8px;flex-direction:column;gap:12px;font-size:13px;line-height:1.4}
    .pay-icon{width:94px;height:62px;display:grid;place-items:center;border-radius:11px;background:#fff;box-shadow:0 0 0 2px #17140f,0 0 0 3px var(--gold);overflow:hidden}
    .pay-icon svg{display:block;width:86px;height:54px}
    .note{margin:var(--gap) 0 0;min-height:40px;color:#c9c0b2;font-size:12px;line-height:1.9}
    .note bdi{color:var(--gold2);font-weight:700;letter-spacing:.5px}
    .note.ok{color:var(--gold2)}
    footer{margin-top:28px;color:#8f877b;font-size:12px}
    @media(max-width:340px){.pay{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:130px}.pay-icon{width:82px}.pay-icon svg{width:76px}}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
<main class="page">
  <div class="mark" aria-hidden="true">أ</div>
  <h1>أثــر</h1>
  <p class="sub">يسعدنا وجودك معانا<br>تابعنا وتواصل معنا من هنا</p>
  <div class="rule gem" aria-hidden="true">◆</div>

  <nav class="links" aria-label="روابط التواصل">

      <svg class="ic" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#1877f2"/><path d="M22 33V22h4l.7-4H22v-2.5c0-1.2.5-2 2.2-2H27V10c-.5-.1-1.7-.2-3.1-.2-3.2 0-5.3 1.9-5.3 5.4V18h-3.5v4h3.5v11z" fill="#fff"/></svg>

    </a>
    <a href="https://wa.me/201043226602" target="_blank" rel="noopener noreferrer">
      <svg class="ic" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#25d366"/><path fill="#fff" d="M29.2 10.8A13 13 0 0 0 8.7 26.5L7 33l6.7-1.7a13 13 0 0 0 15.5-20.5ZM20 30a10.7 10.7 0 0 1-5.4-1.5l-.4-.2-4 .0 1.1-3.8-.3-.4A10.7 10.7 0 1 1 20 30Zm5.9-8c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-2.6-1.6 9.7 9.7 0 0 1-1.8-2.2c-.2-.3 0-.5.1-.7l.5-.6.3-.6c.1-.2 0-.5 0-.6s-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.2-1.2 2.8 1.2 3.2 1.4 3.4a12.5 12.5 0 0 0 4.8 4.2c.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2.1-1.4s.3-1.3.2-1.4-.3-.2-.6-.4Z"/></svg>

  <section class="pay-wrap" aria-label="الدفع الإلكتروني">
    <div class="rule">الدفع الإلكتروني</div>
    <nav class="pay" aria-label="وسائل الدفع">
      <a class="tile" href="#" id="instapay" aria-label="إنستا باي">

        فودافون كاش
      </a>
    </nav>
    <p class="note" id="note" aria-live="polite">فودافون كاش: <bdi dir="ltr">01556355664</bdi><br>باسم: عبد الرحمن ر <bdi dir="ltr">**</bdi></p>
  </section>
  <footer>أثر · حساباتنا الرسمية</footer>
</main>
<script>
(function(){
  var tile=document.getElementById('vfcash');
  var note=document.getElementById('note');
  var original=note.innerHTML;
  var timer;
  function copyText(value){
    if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(value);}
    return new Promise(function(resolve,reject){
      var field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(field);field.select();
      try{document.execCommand('copy')?resolve():reject();}catch(error){reject(error);}finally{document.body.removeChild(field);}
    });
  }
  tile.addEventListener('click',function(event){
    event.preventDefault();
    copyText(tile.getAttribute('data-number')).then(function(){
      note.classList.add('ok');note.textContent='تم نسخ الرقم ✓ — 01556355664';
      clearTimeout(timer);timer=setTimeout(function(){note.classList.remove('ok');note.innerHTML=original;},3000);
    }).catch(function(){window.location.href=tile.getAttribute('href');});
  });
  document.getElementById('instapay').addEventListener('click',function(event){event.preventDefault();});
})();
</script>
