
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100f">
  <title>أثر | حساباتنا الرسمية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold:#c9a96e;
      --gold2:#ead6aa;
      --gold3:#8f754c;
      --ink:#11100f;
      --gap:13px;
      --serif:"Amiri", "Traditional Arabic", Tahoma, serif;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:30px 16px;
      color:#f7f1e7;
      font-family:Tahoma, Arial, sans-serif;
      background:radial-gradient(ellipse at 50% 0%, #46391f 0%, #1a1712 40%, #0b0b0a 100%);
    }

    .page {
      width:min(100%, 430px);
      text-align:center;
      animation:rise .8s ease both;
    }

    @keyframes rise {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation:none; }
      a { transition:none; }
    }

    .mark {
      position:relative;
      width:100px;
      height:100px;
      margin:0 auto 20px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:var(--gold2);
      font:700 50px/1 var(--serif);
      background:radial-gradient(circle at 50% 35%, #2a2316, #14120f 70%);
      box-shadow:0 0 0 1px var(--gold), 0 0 0 6px #14120f, 0 0 0 7px #8f754c88, 0 0 44px #c9a96e2b;
    }

    h1 {
      margin:0;
      font:700 46px/1.25 var(--serif);
      background:linear-gradient(180deg, #f6e8c4 10%, #c9a96e 90%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .sub {
      margin:8px 0 22px;
      color:#c9c0b2;
      font-size:14px;
      line-height:1.9;
    }

    .rule {
      display:flex;
      align-items:center;
      gap:12px;
      margin:0 0 var(--gap);
      color:#b9ad98;
      font-size:13px;
    }

    .rule::before,
    .rule::after {
      content:"";
      flex:1;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--gold3), transparent);
    }

    .rule.gem {
      margin-bottom:24px;
      color:var(--gold);
      font-size:9px;
    }

    .links {
      display:grid;
      gap:var(--gap);
    }

    a {
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      min-height:60px;
      padding:14px 58px;
      border:1px solid #7d6743;
      border-radius:14px;
      color:#f7f1e7;
      text-decoration:none;
      font-weight:700;
      font-size:15px;
      background:linear-gradient(145deg, #2c261c, #16140f);
      box-shadow:inset 0 1px 0 #ffffff12, 0 10px 22px #0000005c;
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    a:hover {
      transform:translateY(-2px);
      border-color:var(--gold2);
      box-shadow:inset 0 1px 0 #ffffff1c, 0 12px 26px #0000006e, 0 0 22px #c9a96e26;
    }

    a:focus-visible {
      outline:2px solid var(--gold2);
      outline-offset:3px;
    }

    .ic {
      width:36px;
      height:36px;
      flex:none;
      display:block;
      box-shadow:0 0 0 2px #17140f, 0 0 0 3px var(--gold);
      border-radius:50%;
    }

    .links .ic {
      position:absolute;
      inset-inline-start:14px;
      top:50%;
      margin-top:-18px;
    }

    .pay-wrap { margin-top:30px; }

    .note {
      margin:var(--gap) 0 0;
      min-height:40px;
      color:#c9c0b2;
      font-size:12px;
      line-height:1.9;
    }

    .note bdi {
      color:var(--gold2);
      font-weight:700;
      letter-spacing:.5px;
    }

    .note.ok { color:var(--gold2); }

    footer {
      margin-top:28px;
      color:#8f877b;
      font-size:12px;
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="mark" aria-hidden="true">أ</div>

    <h1>أثــر</h1>

    <p class="sub">
      يسعدنا وجودك معانا<br>
      تابعنا وتواصل معنا من هنا

    <div class="rule gem" aria-hidden="true">◆</div>

                fill="#fff"/>

      <!-- Instagram -->
      <a href="https://www.instagram.com/atha_r8345?avpt=MTgxNHd3eGJ0OWFqcA%3D%3D&amp;utm_source=qr"

        <svg class="ic" viewBox="0 0 40 40" aria-hidden="true">
          <defs>

          <path fill="#fff" d="M29.1 10.9A12.7 12.7 0 0 0 9 26.2L7.2 33l7-1.8a12.7 12.7 0 0 0 14.9-20.3ZM20 30.1c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.1 1.1 1.1-4-.3-.4A10.1 10.1 0 1 1 20 30.1Zm5.6-7.6c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.6-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1.1-1.1 2.6s1.1 3 1.2 3.2c.2.2 2.2 3.4 5.4 4.8.8.4 1.4.6 1.9.7.8.3 1.5.2 2 .1.6-.1 1.8-.7 2.1-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.3-.6-.4Z"/>
        </svg>

        تواصل معنا على واتساب
      </a>

    </nav>

    <!-- Electronic payment -->
    <section class="pay-wrap">

      <div class="rule">وسائل الدفع الإلكتروني</div>

      <p class="note" id="note" aria-live="polite">
        فودافون كاش:
        <bdi dir="ltr">01556355664</bdi>
        <br>
        باسم: عبد الرحمن ر <bdi dir="ltr">**</bdi>
      </p>

    </section>

    <footer>أثر · حساباتنا الرسمية</footer>

  </main>

  <script>
    (function () {
      var note = document.getElementById('note');
      var original = note.innerHTML;
      var timer;
      var number = '01556355664';

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }

        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:0;opacity:0';

          document.body.appendChild(ta);
          ta.select();

          try {
            document.execCommand('copy') ? resolve() : reject();
          } catch (e) {
            reject(e);
          } finally {
            document.body.removeChild(ta);
          }
        });
      }

      note.style.cursor = 'pointer';
      note.title = 'اضغط لنسخ رقم فودافون كاش';

      note.addEventListener('click', function () {
        copyText(number).then(function () {
          note.classList.add('ok');
          note.innerHTML =
            'تم نسخ الرقم بنجاح ✓<br>باسم: عبد الرحمن ر <bdi dir="ltr">**</bdi>';

          clearTimeout(timer);

          timer = setTimeout(function () {
            note.classList.remove('ok');
            note.innerHTML = original;
          }, 3000);

        }).catch(function () {
          note.innerHTML =
            'انسخ الرقم يدويًا: <bdi dir="ltr">' + number + '</bdi>';
        });
      });

    })();
  </script>

</body>
</html>
