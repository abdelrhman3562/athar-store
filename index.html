<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100f">
  <title>أثر | حساباتنا الرسمية</title>
  <style>
    :root { --gold:#c9a96e; --gold2:#ead6aa; --ink:#11100f; --panel:#1c1a17; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 16px;
      color:#f7f1e7; font-family:Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #3a3021 0%, #171512 42%, #0d0d0c 100%);
    }
    .page { width:min(100%, 430px); text-align:center; }
    .mark {
      width:94px; height:94px; margin:0 auto 18px; display:grid; place-items:center;
      border:1px solid var(--gold); border-radius:50%; color:var(--gold2);
      font-size:37px; box-shadow:0 0 35px #c9a96e22, inset 0 0 22px #c9a96e12;
    }
    h1 { margin:0; font-size:38px; letter-spacing:2px; color:var(--gold2); }
    .sub { margin:10px 0 28px; color:#c9c0b2; font-size:14px; line-height:1.8; }
    .links { display:grid; gap:13px; }
    a {
      display:flex; align-items:center; justify-content:center; gap:12px;
      min-height:58px; padding:15px 18px; border:1px solid #8f754c;
      border-radius:13px; color:#f7f1e7; text-decoration:none; font-weight:700;
      background:linear-gradient(135deg,#28231b,#171512); transition:.18s ease;
    }
    a:hover { transform:translateY(-2px); border-color:var(--gold2); background:#302719; }
    .ico { width:25px; font-size:20px; color:var(--gold2); }
    footer { margin-top:30px; color:#8f877b; font-size:12px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="mark" aria-hidden="true">أ</div>
    <h1>أثــر</h1>
    <p class="sub">يسعدنا وجودك معانا<br>تابعنا وتواصل معنا من هنا</p>
    <nav class="links" aria-label="روابط التواصل">
      <a href="https://www.facebook.com/share/1Fv7MqZPcp/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">
        <span class="ico">f</span> صفحتنا على فيسبوك
      </a>
      <a href="https://www.instagram.com/atha_r8345?avpt=MTgxNHd3eGJ0OWFqcA%3D%3D&amp;utm_source=qr" target="_blank" rel="noopener noreferrer">
        <span class="ico">◎</span> تابعنا على إنستجرام
      </a>
      <a href="https://wa.me/201043226602" target="_blank" rel="noopener noreferrer">
        <span class="ico">◉</span> تواصل معنا على واتساب
      </a>
    </nav>
    <footer>أثر · حساباتنا الرسمية</footer>
  </main>
</body>
</html>
