<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0c0b">
<meta name="description" content="أثر - روابط التواصل ووسائل الدفع الرسمية">
<title>أثر | روابطنا الرسمية</title>
<style>
:root{--bg:#170b10;--panel:#211018;--gold:#c9a36b;--gold2:#f0d6a4;--muted:#c3aeb0;--line:rgba(201,163,107,.25)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#542637 0%,#2b111c 38%,var(--bg) 76%);color:#f7f1e7;font-family:Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px}
.wrap{width:100%;max-width:470px;margin:auto}
.brand{text-align:center;padding:20px 12px 24px}
.logo{width:92px;height:92px;margin:0 auto 14px;border:1px solid var(--gold);border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#482131,#1b0d13);box-shadow:0 12px 36px #0008,inset 0 0 24px #d4b47712}
.logo span{font-family:Georgia,serif;font-size:42px;color:var(--gold2);letter-spacing:1px}
h1{font-size:34px;letter-spacing:5px;margin:0;color:var(--gold2);font-weight:600}
.sub{margin:9px 0 0;color:var(--muted);font-size:13px;letter-spacing:1.5px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:4px 18px 24px}
.section{margin:0 0 19px}
.section-title{font-size:12px;color:var(--gold);letter-spacing:1px;margin:0 5px 10px}
.links{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:13px;text-decoration:none;color:#f8f2e8;padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(110deg,#29131d,#1b0e14);transition:.2s;min-height:64px}
.link:hover{border-color:#d4b477aa;transform:translateY(-1px);background:#351925}
.ico{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#d4b47718;color:var(--gold2);flex:none}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1}
.txt b{display:block;font-size:15px;font-weight:600}
.txt small{display:block;color:#aa9f8d;font-size:11px;margin-top:4px;direction:ltr;text-align:right}
.arrow{color:var(--gold);font-size:18px}
.pay{cursor:pointer;width:100%;font-family:inherit;text-align:right}
.note{text-align:center;color:#8f8576;font-size:11px;line-height:1.8;margin:20px 8px 0}
.footer{text-align:center;color:#766d61;font-size:10px;margin-top:18px;letter-spacing:1px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#e4c98e;color:#17120a;padding:10px 16px;border-radius:30px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){h1{font-size:30px}.link{padding:12px}.txt b{font-size:14px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div class="logo" aria-label="شعار أثر"><span>أثر</span></div>
    <h2> ما يليق بذوقك يبقي أثره  </h2>
    <p class="sub">روابطنا الرسمية · تواصل ودفع</p>
  </header>
  <div class="rule"></div>

  <section class="section">
    <h2 class="section-title">تواصل معنا</h2>
    <div class="links">
      <a class="link" href="https://www.facebook.com/share/1Kh6HmwaDR/?mibextid=wwXIfr" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a5 5 0 0 0-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9a1 1 0 0 1 1-1z"/></svg></span>
        <span class="txt"><b>فيسبوك</b><small>تابعنا على Facebook</small></span><span class="arrow">←</span>
      </a>
      <a class="link" href="https://www.instagram.com/atha_r8345?hvrq=MTgxNHd3eGJ0OWFqcA%3D%3D&amp;utm_source=qr" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
        <span class="txt"><b>إنستجرام</b><small>شاهد أحدث منتجاتنا</small></span><span class="arrow">←</span>
      </a>
      <a class="link" href="https://wa.me/201091342193" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/><path d="M9 8.5c.4 2.3 2.2 4.1 4.5 4.5l1.2-1.2 2 1c-.3 1.3-1.3 2.2-2.6 2.1-3.7-.4-6.6-3.3-7-7-.1-1.3.8-2.3 2.1-2.6l1 2z"/></svg></span>
        <span class="txt"><b>واتساب</b><small>+201043226602</small></span><span class="arrow">←</span>
      </a>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">وسائل الدفع</h2>
    <div class="links">
      <button class="link pay" type="button" onclick="copyVodafone()">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 18.5h4"/></svg></span>
        <span class="txt"><b>فودافون كاش</b><small>01556355664 · اضغط لنسخ الرقم</small></span><span class="arrow">⧉</span>
      </button>
      <a class="link" href="https://ipn.eg/S/refatabdelrhman/instapay/9vdGux" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 12h16M13 5l7 7-7 7"/><path d="M4 5v14"/></svg></span>
        <span class="txt"><b>إنستاباي</b><small>اضغط للدفع عبر InstaPay</small></span><span class="arrow">←</span>
      </a>
    </div>
  </section>
  <p class="note">يسعدنا تواصلكم معنا، وشكرًا لثقتكم في أثر.</p>
  <footer class="footer">ATHAR · OFFICIAL LINKS</footer>
</main>
<div id="toast" class="toast" role="status">تم نسخ رقم فودافون كاش</div>
<script>
function copyVodafone(){
 const number='01556355664';
 if(navigator.clipboard && window.isSecureContext){
   navigator.clipboard.writeText(number).then(showToast).catch(()=>fallbackCopy(number));
 }else fallbackCopy(number);
}
function fallbackCopy(value){
 const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();
 try{document.execCommand('copy');showToast()}catch(e){alert('رقم فودافون كاش: '+value)}
 document.body.removeChild(el);
}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
</script>
</body>
</html>
